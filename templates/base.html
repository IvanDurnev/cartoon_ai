<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Cartoon AI{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: #f8f5ff; }
    .navbar { background: linear-gradient(90deg, #7c3aed, #a855f7); }
    .navbar-brand, .nav-link { color: #fff !important; }
    .card { border: none; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    .card-header { border-radius: 16px 16px 0 0 !important; }
    .btn-primary { background: #7c3aed; border-color: #7c3aed; }
    .btn-primary:hover { background: #6d28d9; border-color: #6d28d9; }
    .avatar-card { cursor: pointer; transition: transform .15s, box-shadow .15s; }
    .avatar-card:hover { transform: translateY(-4px); box-shadow: 0 6px 20px rgba(124,58,237,.25); }
    .avatar-card.selected { border: 3px solid #7c3aed !important; }
    .spinner-border-sm { width: 1rem; height: 1rem; }
    .child-photo { width: 80px; height: 80px; object-fit: cover; border-radius: 50%; border: 3px solid #a855f7; }
    .child-photo-lg { width: 120px; height: 120px; object-fit: cover; border-radius: 50%; border: 4px solid #a855f7; }
    .avatar-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 12px; }
    .pending-placeholder { width: 100%; aspect-ratio: 1/1; background: #f3f0ff;
      border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #a78bfa; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold fs-4" href="{{ url_for('index') }}">
      <i class="bi bi-stars"></i> Cartoon AI
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint in ('index','add_child','child_detail','generate_avatars','select_avatar','delete_child') %}fw-semibold{% endif %}"
             href="{{ url_for('index') }}">
            <i class="bi bi-people-fill me-1"></i>Дети
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint and request.endpoint.startswith('character') %}fw-semibold{% endif %}"
             href="{{ url_for('characters') }}">
            <i class="bi bi-person-badge-fill me-1"></i>Персонажи
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint in ('templates4_list', 'template4_detail', 'create_template4_scene', 'generate_template4_scene') %}fw-semibold{% endif %}"
             href="{{ url_for('templates4_list') }}">
            <i class="bi bi-film me-1"></i>Проекты
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container pb-5">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
