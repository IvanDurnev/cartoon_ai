upstream cartoons_ai_app {
    server 127.0.0.1:8001;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.cartoons.itd.dev;

    return 301 https://cartoons.itd.dev$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name cartoons.itd.dev;

    client_max_body_size 25m;

    location / {
        proxy_pass http://cartoons_ai_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.cartoons.itd.dev;

    ssl_certificate /etc/letsencrypt/live/cartoons.itd.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cartoons.itd.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://cartoons.itd.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
